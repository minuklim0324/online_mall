server:
  port: 8092

logging:
  level:
    com.mall.payment.repository.PaymentMapper: DEBUG

spring:
  application:
    name: payment-service
  datasource:
    #url: jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    url: jdbc:mysql://127.0.0.1:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true